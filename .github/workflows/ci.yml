name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs the whole CI before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Codecov upload without a token
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.10"
          enable-cache: true
          cache-local-path: .cache/uv

      - name: Set up Python
        run: uv python install

      - name: Install system libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: make lint

      - name: Check formatting
        run: make format-check

      - name: Typecheck
        run: make typecheck

      - name: Check OpenAPI document
        run: make openapi-check

      - name: Build documentation
        run: make docs-build

      - name: Tests with coverage
        run: make coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: .cache/coverage/coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

  core:
    name: Install without extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.10"

      - name: Set up Python
        run: uv python install

      - name: Install the core only (no extras, no dev tools)
        run: uv sync --frozen --no-dev

      - name: Check the core install
        run: uv run --no-sync python scripts/check_core_install.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build prod image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          load: true
          tags: jodit-python:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name jcpy -p 8081:8081 jodit-python:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8081/ping; then
              docker rm -f jcpy
              exit 0
            fi
            sleep 1
          done
          docker logs jcpy
          exit 1
