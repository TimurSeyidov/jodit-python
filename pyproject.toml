[project]
name = "jodit-python"
version = "0.2.0"
description = "Jodit FileBrowser and Uploader connector for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Timur Seiidov", email = "tim@jlabs.pro" }]
requires-python = ">=3.14"
keywords = ["jodit", "file-manager", "uploader", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pillow>=11.0",
    "pydantic>=2.11",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
# generatePdf; WeasyPrint also needs the Pango system library.
pdf = ["weasyprint>=66"]
# generateDocx
docx = ["beautifulsoup4>=4.12", "html-for-docx>=1.2", "python-docx>=1.1"]
# The s3 storage adapter
s3 = ["boto3>=1.35"]
# The sftp storage adapter
sftp = ["paramiko>=3.5"]
all = ["jodit-python[pdf,docx,s3,sftp]"]

[project.urls]
Homepage = "https://github.com/TimurSeyidov/jodit-python"
Documentation = "https://timurseyidov.github.io/jodit-python/"
Repository = "https://github.com/TimurSeyidov/jodit-python"
Issues = "https://github.com/TimurSeyidov/jodit-python/issues"
Changelog = "https://github.com/TimurSeyidov/jodit-python/blob/main/CHANGELOG.md"

[project.scripts]
jcpy = "jcpy.run:main"

[build-system]
requires = ["uv_build>=0.10,<0.13"]
build-backend = "uv_build"

[tool.uv]
cache-dir = ".cache/uv"

[tool.uv.build-backend]
module-name = "jcpy"

[dependency-groups]
dev = [
    "jodit-python[all]",
    "boto3-stubs[s3]>=1.35",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "mypy>=1.15",
    "openapi-spec-validator>=0.7",
    "pyjwt>=2.9",
    "pypdf>=5",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pyyaml>=6",
    "ruff>=0.11",
    "testcontainers[minio]>=4.9",
    "types-pyyaml>=6.0.12.20260906",
    "pyftpdlib>=2.0",
    "types-paramiko>=3.5",
    "pyopenssl>=24",
    "wsgidav>=4.3",
    "cheroot>=10",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
    "mkdocs-swagger-ui-tag>=0.8.1",
    "pymdown-extensions>=12.1",
]

[tool.ruff]
line-length = 79
target-version = "py314"
src = ["src", "tests"]
cache-dir = ".cache/ruff"

[tool.ruff.format]
# Code blocks in the docs contain snippet markers ruff would rewrite.
exclude = ["docs/**"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF",
    "ANN", "ASYNC", "S", "PT", "RET", "PTH", "TC",
]
ignore = [
    "B008",  # FastAPI Depends() in defaults is the intended DI pattern
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic and FastAPI read annotations at runtime.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
# FastAPI inspects endpoint annotations such as `request: Request`.
exempt-modules = ["typing", "fastapi", "starlette.requests"]

[tool.ruff.lint.per-file-ignores]
# Test setup may touch the filesystem synchronously.
"tests/**" = ["S101", "ASYNC240", "S106"]
# Plain FTP is what the ftp adapter is for; FTPS is an option.
"src/jcpy/storage/ftp.py" = ["S321"]
"tests/unit/test_ftp.py" = ["S321"]
"tests/integration/test_file_servers.py" = ["S321"]

[tool.ruff.lint.isort]
known-first-party = ["jcpy"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests", "scripts", "examples"]
mypy_path = "src"
explicit_package_bases = true
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
cache_dir = ".cache/mypy"

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[[tool.mypy.overrides]]
# No type information is published for these libraries.
module = ["weasyprint", "weasyprint.*", "html4docx", "html4docx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test FTP and WebDAV servers; Docker client used by Testcontainers.
module = [
    "pyftpdlib",
    "pyftpdlib.*",
    "docker",
    "docker.*",
    "wsgidav",
    "wsgidav.*",
    "cheroot",
    "cheroot.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["docker: needs a Docker daemon (skipped when none is reachable)"]
asyncio_mode = "auto"
# Leaked files and sockets fail the test that leaks them.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
asyncio_default_fixture_loop_scope = "function"
cache_dir = ".cache/pytest"

[tool.coverage.run]
source = ["jcpy"]
branch = true
data_file = ".cache/coverage/.coverage"

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = ".cache/coverage/html"
