site_name: Jodit Connector for Python
site_description: >-
  Python/FastAPI implementation of the Jodit File Browser and Uploader
  connector, API-compatible with jodit-nodejs
site_url: https://timurseyidov.github.io/jodit-python/

repo_name: TimurSeyidov/jodit-python
repo_url: https://github.com/TimurSeyidov/jodit-python
edit_uri: edit/main/docs/content/

docs_dir: content
site_dir: ../site

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.path
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit

plugins:
  - search
  - swagger-ui-tag

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # Paths are relative to the repository root (run mkdocs from it).
      base_path: ["."]
      check_paths: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Getting Started: index.md
  - Usage:
      - Installation & Setup: installation.md
      - Python API: usage.md
      - FastAPI Integration: integration.md
      - Examples: examples.md
  - Reference:
      - API Endpoints: api.md
      - API Reference (Swagger): api-swagger/index.md
      - Authentication: authentication.md
      - Access Control: access-control.md
      - Configuration: config.md
      - Storage Adapters: storage-adapters.md
      - AWS S3 & S3-compatible: aws-s3.md
      - FTP & SFTP: ftp-sftp.md
      - WebDAV: webdav.md
      - Dynamic Sources (multi-tenant): dynamic-sources.md
      - Documents (PDF & DOCX): documents.md
  - Development:
      - Development & Testing: development.md
      - Architecture: architecture.md
  - Deployment:
      - Docker: docker.md

extra:
  homepage: https://xdsoft.net/jodit/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TimurSeyidov/jodit-python
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/jodit-python/

copyright: Copyright &copy; 2026 jodit-python contributors
