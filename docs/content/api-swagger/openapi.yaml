      properties:
        withFolders:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: Include folders
          title: Withfolders
        onlyImages:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: Only image files
          title: Onlyimages
        offset:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: First item
          title: Offset
        limit:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: Number of items
          title: Limit
        sortBy:
