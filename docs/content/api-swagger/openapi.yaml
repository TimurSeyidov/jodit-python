openapi: 3.1.0
info:
  title: Jodit Connector API
  version: 0.1.0
  description: Jodit FileBrowser and Uploader connector for Python, API-compatible
    with jodit-nodejs.
  license:
    name: MIT
    identifier: MIT
servers:
- url: http://localhost:8081/
  description: Local development server
paths:
  /ping:
    get:
      operationId: ping
      summary: Health check
      description: Answers before authentication and tenant resolution; adds CORS
        headers for allowed origins.
      tags:
      - System
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /files:
    get:
      operationId: files
      summary: Get list of files
      description: 'Lists files (and optionally folders) of a directory in the requested
        source or in every source.


        Also available as `/?action=files`.'
      tags:
      - Files
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResponse'
        '400':
          description: Invalid parameters or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source, path or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Non-numeric paging parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: source
        in: query
        required: false
        schema:
          type: string
          description: Source name; the first (or every) source when omitted
          examples: &id016
          - default
          title: Source
        description: Source name; the first (or every) source when omitted
      - name: path
        in: query
        required: false
        schema:
          type: string
          description: Directory inside the source
          examples: &id017
          - /
          title: Path
        description: Directory inside the source
      - name: mods[withFolders]
        in: query
        required: false
        schema:
          type: boolean
          description: Include folders
          title: Withfolders
        description: Include folders
      - name: mods[onlyImages]
        in: query
        required: false
        schema:
          type: boolean
          description: Only image files
          title: Onlyimages
        description: Only image files
      - name: mods[offset]
        in: query
        required: false
        schema:
          type: integer
          description: First item
          title: Offset
        description: First item
      - name: mods[limit]
        in: query
        required: false
        schema:
          type: integer
          description: Number of items
          title: Limit
        description: Number of items
      - name: mods[sortBy]
        in: query
        required: false
        schema:
          enum: &id014
          - name-asc
          - name-desc
          - changed-asc
          - changed-desc
          - size-asc
          - size-desc
          type: string
          description: Sort order
          title: Sortby
        description: Sort order
      - name: mods[foldersPosition]
        in: query
        required: false
        schema:
          enum: &id015
          - default
          - top
          - bottom
          type: string
          description: Where folders go
          title: Foldersposition
        description: Where folders go
      - name: mods[filterWord]
        in: query
        required: false
        schema:
          type: string
          description: Case-insensitive part of the names to keep
          title: Filterword
        description: Case-insensitive part of the names to keep
  /fileUpload:
    post:
      operationId: fileUpload
      summary: Upload files
      description: 'Uploads one or more files into a directory via multipart/form-data.


        Also available as `/?action=fileUpload`.'
      tags:
      - Files
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Invalid parameters or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source, path or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadForm'
  /fileUploadRemote:
    get:
      operationId: fileUploadRemote
      summary: Upload file from remote URL
      description: 'Downloads a file from a public http(s) URL into a directory.
        Private and local addresses are refused unless allowPrivateNetworkUploads
        is on.


        Also available as `/?action=fileUploadRemote`.'
      tags:
      - Files
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteUploadResponse'
        '400':
          description: Invalid parameters or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source, path or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: source
        in: query
        required: false
        schema:
          type: string
          description: Source name; the first (or every) source when omitted
          examples: &id034
          - default
          title: Source
        description: Source name; the first (or every) source when omitted
      - name: path
        in: query
        required: false
        schema:
          type: string
          description: Directory inside the source
          examples: &id035
          - /
          title: Path
        description: Directory inside the source
      - name: url
        in: query
        required: true
        schema: &id036
          description: File to download
          examples:
          - https://example.com/a.png
          title: Url
          type: string
        description: File to download
  /fileRemove:
    get:
      operationId: fileRemove
      summary: Remove file
      description: 'Removes a file from a directory.


        Also available as `/?action=fileRemove`.'
      tags:
      - Files
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoneResponse'
        '400':
          description: Invalid parameters or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source, path or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: source
        in: query
        required: false
        schema:
          type: string
          description: Source name; the first (or every) source when omitted
          examples: &id003
          - default
          title: Source
        description: Source name; the first (or every) source when omitted
      - name: path
        in: query
        required: false
        schema:
          type: string
          description: Directory inside the source
          examples: &id004
          - /
          title: Path
        description: Directory inside the source
      - name: name
        in: query
        required: true
        schema: &id005
          description: Entry name
          examples:
          - photo.jpg
          title: Name
          type: string
        description: Entry name
  /fileMove:
    get:
      operationId: fileMove
      summary: Move file or folder
      description: 'Moves a file or folder (`from`, relative to the root) into the
        directory `path`.


        Also available as `/?action=fileMove`.'
      tags:
      - Files
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoneResponse'
        '400':
          description: Invalid parameters or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source, path or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: source
        in: query
        required: false
        schema:
          type: string
          description: Source name
          title: Source
        description: Source name
      - name: from
        in: query
        required: true
        schema: &id001
          description: Entry path relative to the source root
          examples:
          - /photos/photo.jpg
          title: From
          type: string
        description: Entry path relative to the source root
      - name: path
        in: query
        required: false
        schema:
          type: string
          description: Destination directory (the root when omitted)
          examples: &id002
          - /archive
          title: Path
        description: Destination directory (the root when omitted)
  /fileCopy:
    get:
      operationId: fileCopy
      summary: Copy file
      description: 'Copies a file; a taken name gets a " (N)" suffix, so copying
        into the same folder duplicates the file.


        Also available as `/?action=fileCopy`.'
      tags:
      - Files
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoneResponse'
        '400':
          description: Invalid parameters or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source, path or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: source
        in: query
        required: false
        schema:
          type: string
          description: Source name
          title: Source
        description: Source name
      - name: from
        in: query
        required: true
        schema: *id001
        description: Entry path relative to the source root
      - name: path
        in: query
        required: false
        schema:
          type: string
          description: Destination directory (the root when omitted)
          examples: *id002
          title: Path
        description: Destination directory (the root when omitted)
  /fileRename:
    get:
      operationId: fileRename
      summary: Rename file or folder
      description: 'Renames an entry of a directory; files keep their extension.


        Also available as `/?action=fileRename`.'
      tags:
      - Files
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoneResponse'
        '400':
          description: Invalid parameters or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source, path or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: source
        in: query
        required: false
        schema:
          type: string
          description: Source name; the first (or every) source when omitted
          examples: &id006
          - default
          title: Source
        description: Source name; the first (or every) source when omitted
      - name: path
        in: query
        required: false
        schema:
          type: string
          description: Directory inside the source
          examples: &id007
          - /
          title: Path
        description: Directory inside the source
      - name: name
        in: query
        required: true
        schema: &id008
          description: Entry name
          examples:
          - photo.jpg
          title: Name
          type: string
        description: Entry name
      - name: newname
        in: query
        required: true
        schema: &id009
          description: New name
          examples:
          - holiday.jpg
          title: Newname
          type: string
        description: New name
  /fileDownload:
    get:
      operationId: fileDownload
      summary: Download file
      description: 'Sends a file as an attachment.


        Also available as `/?action=fileDownload`.'
      tags:
      - Files
      responses:
        '200':
          description: File
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid parameters or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source, path or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: source
        in: query
        required: false
        schema:
          type: string
          description: Source name; the first (or every) source when omitted
          examples: *id003
          title: Source
        description: Source name; the first (or every) source when omitted
      - name: path
        in: query
        required: false
        schema:
          type: string
          description: Directory inside the source
          examples: *id004
          title: Path
        description: Directory inside the source
      - name: name
        in: query
        required: true
        schema: *id005
        description: Entry name
  /getLocalFileByUrl:
    get:
      operationId: getLocalFileByUrl
      summary: Resolve local file by URL
      description: 'Finds which source file a public URL points to.


        Also available as `/?action=getLocalFileByUrl`.'
      tags:
      - Files
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalFileResponse'
        '400':
          description: Invalid parameters or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: url
        in: query
        required: true
        schema: &id041
          description: Public URL of a file
          examples:
          - http://localhost:8081/files/photo.jpg
          title: Url
          type: string
        description: Public URL of a file
  /folders:
    get:
      operationId: folders
      summary: Get folders list
      description: 'Lists the sub-folders of a directory in the requested source
        or in every source.


        Also available as `/?action=folders`.'
      tags:
      - Folders
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoldersResponse'
        '400':
          description: Invalid parameters or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source, path or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: source
        in: query
        required: false
        schema:
          type: string
          description: Source name; the first (or every) source when omitted
          examples: &id021
          - default
          title: Source
        description: Source name; the first (or every) source when omitted
      - name: path
        in: query
        required: false
        schema:
          type: string
          description: Directory inside the source
          examples: &id022
          - /
          title: Path
        description: Directory inside the source
      - name: dots
        in: query
        required: false
        schema:
          type: boolean
          description: Start with `.` or `..` (default true)
          title: Dots
        description: Start with `.` or `..` (default true)
  /folderCreate:
    get:
      operationId: folderCreate
      summary: Create new folder
      description: 'Creates a folder; unsafe characters of the name become `_`.


        Also available as `/?action=folderCreate`.'
      tags:
      - Folders
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesResponse'
        '400':
          description: Invalid parameters or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source, path or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: source
        in: query
        required: false
        schema:
          type: string
          description: Source name; the first (or every) source when omitted
          examples: &id018
          - default
          title: Source
        description: Source name; the first (or every) source when omitted
      - name: path
        in: query
        required: false
        schema:
          type: string
          description: Directory inside the source
          examples: &id019
          - /
          title: Path
        description: Directory inside the source
      - name: name
        in: query
        required: true
        schema: &id020
          description: New folder name
          examples:
          - photos
          title: Name
          type: string
        description: New folder name
  /folderRemove:
    get:
      operationId: folderRemove
      summary: Remove folder
      description: 'Removes a folder with everything in it.


        Also available as `/?action=folderRemove`.'
      tags:
      - Folders
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoneResponse'
        '400':
          description: Invalid parameters or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source, path or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: source
        in: query
        required: false
        schema:
          type: string
          description: Source name; the first (or every) source when omitted
          examples: *id003
          title: Source
        description: Source name; the first (or every) source when omitted
      - name: path
        in: query
        required: false
        schema:
          type: string
          description: Directory inside the source
          examples: *id004
          title: Path
        description: Directory inside the source
      - name: name
        in: query
        required: true
        schema: *id005
        description: Entry name
  /folderMove:
    get:
      operationId: folderMove
      summary: Move folder
      description: 'Moves a folder (`from`, relative to the root) into `path`.


        Also available as `/?action=folderMove`.'
      tags:
      - Folders
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoneResponse'
        '400':
          description: Invalid parameters or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source, path or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: source
        in: query
        required: false
        schema:
          type: string
          description: Source name
          title: Source
        description: Source name
      - name: from
        in: query
        required: true
        schema: *id001
        description: Entry path relative to the source root
      - name: path
        in: query
        required: false
        schema:
          type: string
          description: Destination directory (the root when omitted)
          examples: *id002
          title: Path
        description: Destination directory (the root when omitted)
  /folderCopy:
    get:
      operationId: folderCopy
      summary: Copy folder
      description: 'Copies a folder recursively; a taken name gets a " (N)" suffix.
        Copying a folder into itself is refused.


        Also available as `/?action=folderCopy`.'
      tags:
      - Folders
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoneResponse'
        '400':
          description: Invalid parameters or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source, path or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: source
        in: query
        required: false
        schema:
          type: string
          description: Source name
          title: Source
        description: Source name
      - name: from
        in: query
        required: true
        schema: *id001
        description: Entry path relative to the source root
      - name: path
        in: query
        required: false
        schema:
          type: string
          description: Destination directory (the root when omitted)
          examples: *id002
          title: Path
        description: Destination directory (the root when omitted)
  /folderRename:
    get:
      operationId: folderRename
      summary: Rename folder
      description: 'Renames a folder of a directory.


        Also available as `/?action=folderRename`.'
      tags:
      - Folders
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoneResponse'
        '400':
          description: Invalid parameters or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source, path or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: source
        in: query
        required: false
        schema:
          type: string
          description: Source name; the first (or every) source when omitted
          examples: *id006
          title: Source
        description: Source name; the first (or every) source when omitted
      - name: path
        in: query
        required: false
        schema:
          type: string
          description: Directory inside the source
          examples: *id007
          title: Path
        description: Directory inside the source
      - name: name
        in: query
        required: true
        schema: *id008
        description: Entry name
      - name: newname
        in: query
        required: true
