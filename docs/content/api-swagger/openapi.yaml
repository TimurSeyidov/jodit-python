components:
  schemas:
    CropBox:
      description: Region to keep, sent as ``box[x]``, ``box[y]``, ``box[w]``...
      properties:
        w: *id010
        h: *id011
        x: *id012
        y: *id013
      required:
      - w
      - h
      - x
      - y
      title: CropBox
      type: object
    Done:
      description: Result of an action without payload.
      properties:
        code:
          const: 220
          default: 220
          title: Code
          type: integer
      title: Done
      type: object
    DoneResponse:
      description: Success envelope without payload.
      properties:
        success:
          const: true
          title: Success
          type: boolean
        data:
          $ref: '#/components/schemas/Done'
      required:
      - success
      - data
      title: DoneResponse
      type: object
    ErrorData:
      description: Error details.
      properties:
        code:
          description: HTTP status
          examples:
          - 400
          title: Code
          type: integer
        messages:
          examples:
          - - Validation failed
          items:
            type: string
          title: Messages
          type: array
      required:
      - code
      - messages
      title: ErrorData
      type: object
    ErrorResponse:
      description: Error envelope.
      properties:
        success:
          const: false
          title: Success
          type: boolean
        data:
          $ref: '#/components/schemas/ErrorData'
      required:
      - success
      - data
      title: ErrorResponse
      type: object
    FileItem:
      description: Entry of a listing.
      properties:
        file:
          examples:
          - photo.jpg
          title: File
          type: string
        name:
          examples:
          - photo.jpg
          title: Name
          type: string
        type:
          enum:
          - file
          - image
          - folder
          title: Type
          type: string
        isImage:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Isimage
        size:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          examples:
          - 1.5MB
          title: Size
        changed:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          examples:
          - 9/24/2026 1:02:03 PM
          title: Changed
        thumb:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          examples:
          - _thumbs/photo.jpg
          title: Thumb
      required:
      - file
      - name
      - type
      title: FileItem
      type: object
    FilesData:
      description: Result of ``files``.
      properties:
        code:
          const: 220
          default: 220
          title: Code
          type: integer
